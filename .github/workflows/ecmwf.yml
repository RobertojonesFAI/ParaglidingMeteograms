# Fetches the ECMWF IFS forecast for every launch once an hour from
# Open-Meteo (ECMWF open data, CC BY 4.0) and publishes it under ecmwf/:
#   ecmwf/sites/<slug>.json   hourly surface wind, gusts, boundary-layer
#                             height, cloud layers (IFS 9 km) and winds at
#                             850 / 700 hPa (IFS 0.25°)
#   ecmwf/manifest.json       what the run published (uploaded last)
#
# ECMWF runs every 6 hours; an hourly fetch picks each run up within the hour
# of Open-Meteo having it. Two requests per launch. Open-Meteo's free API is
# for non-commercial use. Skipped until the METEO_R2_BUCKET variable is set.
name: ECMWF forecast

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecmwf
  cancel-in-progress: false

jobs:
  ecmwf:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Fetch and publish
        run: scripts/run-annotated.sh "ECMWF forecast" pnpm run ecmwf --publish
