# Publishes the Boise thermal forecast (thermals/pipeline.py) to R2 as
# thermal_predictions.json:
#   - Fetches NOAA HRRR (via Herbie) for the hours of today that have not
#     passed and runs the two models on the 690 cells.
#   - Hours that have passed, and all of yesterday, keep the forecast they had.
#   - The models were trained on March to September; other months are
#     forecast too, marked out of season so the page warns about them.
#   - If NOAA HRRR is unavailable or the result fails validation, it publishes
#     nothing and the site keeps the last forecast.
name: Boise thermal forecast

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Recompute the remaining hours even if this hour is done"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: thermals
  cancel-in-progress: false

jobs:
  thermals:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    timeout-minutes: 25
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The eccodes wheel bundles the ecCodes library, so no apt packages are needed.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thermals/requirements.txt
      - run: pip install -r thermals/requirements.txt
      - name: Forecast and publish
        run: python -m thermals.pipeline ${{ inputs.force && '--force' || '' }}
