# Checks the providers every 15 minutes for new model runs and publishes the
# derived per-launch forecast documents to the R2 bucket. A tick with no new
# run is cheap (one availability probe per model plus one manifest read);
# uploads only happen when a run actually advances.
#
# One job per provider host, running in parallel; within a job the models run
# in sequence, lightest first, and each publishes as soon as it finishes:
#   noaa       (NOAA buckets)          hrrr-conus 3 km 48 h, rrfs 3 km 84 h, gfs 25 km 16 d
#   eccc-dd    (dd.weather.gc.ca)      rdps 10 km 84 h, gdps 15 km 10 d
#   eccc-hpfx  (ECCC's faster mirror)  hrdps-continental 2.5 km 48 h, geps 21-member ensemble 16 d
# ECCC serves whole-domain files (several GB per run), so its jobs are the
# heavy ones; splitting by host follows the reference operator.
#
# All jobs are skipped until the METEO_R2_BUCKET repository variable is set.
name: Build forecasts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaa:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    concurrency:
      group: build-noaa
      cancel-in-progress: false
    # A first run, or a tick where all three models have a new run, downloads
    # HRRR (~6 min), RRFS (~11 min) and GFS (~10 min) back to back.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: HRRR 3 km
        id: hrrr
        continue-on-error: true
        run: scripts/build-model.sh hrrr-conus

      - name: RRFS 3 km
        id: rrfs
        continue-on-error: true
        # NOAA's RRFS feed moved to the noaa-rrfs-ops-pds bucket in August 2026.
        # Remove this override once the pinned engine defaults to it.
        env:
          METEO_RRFS_BASE: https://noaa-rrfs-ops-pds.s3.amazonaws.com
        run: scripts/build-model.sh rrfs

      - name: GFS 25 km
        id: gfs
        continue-on-error: true
        run: scripts/build-model.sh gfs

      - name: Summary
        if: always()
        env:
          RESULTS: "HRRR 3 km=${{ steps.hrrr.outcome }};RRFS 3 km=${{ steps.rrfs.outcome }};GFS 25 km=${{ steps.gfs.outcome }}"
        run: scripts/job-summary.sh

  eccc-dd:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    concurrency:
      group: build-eccc-dd
      cancel-in-progress: false
    timeout-minutes: 90
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: RDPS 10 km
        id: rdps
        continue-on-error: true
        run: scripts/build-model.sh rdps

      - name: GDPS 15 km
        id: gdps
        continue-on-error: true
        run: scripts/build-model.sh gdps

      - name: Summary
        if: always()
        env:
          RESULTS: "RDPS 10 km=${{ steps.rdps.outcome }};GDPS 15 km=${{ steps.gdps.outcome }}"
        run: scripts/job-summary.sh

  eccc-hpfx:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    concurrency:
      group: build-eccc-hpfx
      cancel-in-progress: false
    timeout-minutes: 120
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
      # ECCC's higher-bandwidth mirror for the heaviest streams.
      METEO_DATAMART_BASE: https://hpfx.collab.science.gc.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: HRDPS 2.5 km
        id: hrdps
        continue-on-error: true
        run: scripts/build-model.sh hrdps-continental

      - name: GEPS ensemble
        id: geps
        continue-on-error: true
        run: scripts/build-model.sh geps

      - name: Summary
        if: always()
        env:
          RESULTS: "HRDPS 2.5 km=${{ steps.hrdps.outcome }};GEPS ensemble=${{ steps.geps.outcome }}"
        run: scripts/job-summary.sh
