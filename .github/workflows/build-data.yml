# Checks the providers every 15 minutes for new model runs and publishes the
# derived per-launch forecast documents to the R2 bucket. A tick with no new
# run is cheap (one availability probe per model plus one manifest read);
# uploads only happen when a run actually advances.
#
# Models, all NOAA, built in sequence so runs.json is never written by two
# publishers at once:
#   hrrr-conus  3 km, 48 h   - the main "today / tomorrow" forecast
#   rrfs        3 km, 84 h   - NAM's successor (experimental feed)
#   gfs         25 km, 16 d  - long-range trend
#
# HRDPS (ECCC, Canada, 2.5 km) is opt-in: set the repository variable
# ENABLE_HRDPS to "true" to try it. Its domain may not reach Boise; if it
# does not, the build fails with an out-of-grid error and publishes nothing.
#
# Both jobs are skipped until the METEO_R2_BUCKET repository variable is set.
name: Build forecasts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaa:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != ''
    concurrency:
      group: build-noaa
      cancel-in-progress: false
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: HRRR 3 km
        id: hrrr
        continue-on-error: true
        run: scripts/build-model.sh hrrr-conus

      - name: RRFS 3 km
        id: rrfs
        continue-on-error: true
        # NOAA's RRFS feed moved to the noaa-rrfs-ops-pds bucket in August 2026.
        # Remove this override once the pinned engine defaults to it.
        env:
          METEO_RRFS_BASE: https://noaa-rrfs-ops-pds.s3.amazonaws.com
        run: scripts/build-model.sh rrfs

      - name: GFS 25 km
        id: gfs
        continue-on-error: true
        run: scripts/build-model.sh gfs

      - name: Summary
        if: always()
        env:
          HRRR: ${{ steps.hrrr.outcome }}
          RRFS: ${{ steps.rrfs.outcome }}
          GFS: ${{ steps.gfs.outcome }}
        run: |
          {
            echo "| Model | Result |"
            echo "| --- | --- |"
            echo "| HRRR 3 km | $HRRR |"
            echo "| RRFS 3 km | $RRFS |"
            echo "| GFS 25 km | $GFS |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HRRR" != "success" ] && [ "$RRFS" != "success" ] && [ "$GFS" != "success" ]; then
            echo "::error::every model failed this tick"
            exit 1
          fi

  eccc:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.METEO_R2_BUCKET != '' && vars.ENABLE_HRDPS == 'true'
    # Shares runs.json with the NOAA job; queue behind it rather than publish concurrently.
    needs: noaa
    concurrency:
      group: build-eccc
      cancel-in-progress: false
    timeout-minutes: 90
    defaults:
      run:
        working-directory: forecasts
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
      # ECCC's higher-bandwidth mirror, as the reference operator uses for HRDPS.
      METEO_DATAMART_BASE: https://hpfx.collab.science.gc.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: forecasts/package.json
          cache: true
          cache_dependency_path: forecasts/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: HRDPS 2.5 km
        run: scripts/build-model.sh hrdps-continental
